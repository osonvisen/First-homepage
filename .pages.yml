# Pages CMS configuration (https://pagescms.org)
# "shared" applies to both languages. "norwegian" and "english" use the same fields, one per language.
# Field names are English (code); labels are Norwegian (what you see in the editor).
media:
  input: public/media
  output: media

content:
  - name: shared
    label: Felles (navn, bilde, kontakt)
    type: file
    path: src/content/shared.json
    format: json
    fields:
      - { name: name, label: Navn, type: string, required: true }
      - { name: image, label: Bilde av deg, type: image, description: "Kvadratisk bilde blir finest. Siden lager mindre versjoner automatisk." }
      - { name: location, label: Sted, type: string }
      - { name: openToWork, label: Vis «Åpen for nye muligheter», type: boolean }
      - { name: emailUser, label: "E-post: delen før @", type: string, description: "Settes sammen først når noen klikker «Vis e-post»." }
      - { name: emailDomain, label: "E-post: delen etter @", type: string }
      - name: links
        label: Lenker
        type: object
        list: true
        fields:
          - { name: label, label: Tekst, type: string }
          - { name: url, label: Adresse, type: string }

  - name: norwegian
    label: Norsk tekst
    type: file
    path: src/content/nb.json
    format: json
    fields: &textFields
      - { name: role, label: Rolle, type: string, required: true }
      - { name: roleDetail, label: Rolle – detalj, type: string }
      - { name: status, label: Statustekst, type: string }
      - { name: intro, label: Ingress, type: text }
      - { name: lookingFor, label: Hva du ser etter, type: text }
      - name: now
        label: Akkurat nå
        type: object
        list: true
        fields:
          - { name: label, label: Etikett, type: string }
          - { name: title, label: Tittel, type: string }
          - { name: text, label: Tekst, type: text }
      - name: projects
        label: Prosjekter
        type: object
        list: true
        fields:
          - { name: company, label: Firma, type: string }
          - { name: note, label: Merknad, type: string }
          - { name: title, label: Tittel, type: string }
          - { name: highlights, label: Punkter, type: string, list: true }
          - { name: tags, label: Tagger (kommaseparert), type: string }
      - name: experience
        label: Erfaring og utdanning
        type: object
        list: true
        fields:
          - { name: period, label: Periode, type: string }
          - { name: place, label: Sted, type: string }
          - { name: role, label: Rolle, type: string }
          - { name: current, label: Pågående, type: boolean }
      - { name: about, label: Om meg, type: text, description: "En tom linje gir nytt avsnitt." }
      - { name: beforeCode, label: Før koden, type: text }
      - name: stack
        label: Verktøykassa
        type: object
        list: true
        fields:
          - { name: group, label: Gruppe, type: string }
          - { name: tools, label: Verktøy, type: string }
      - { name: gamesIntro, label: Spill – undertekst, type: string }
      - name: games
        label: Spill
        type: object
        list: true
        fields:
          - { name: title, label: Tittel, type: string }
          - { name: description, label: Beskrivelse, type: text }
          - { name: url, label: Lenke, type: string, description: "For spill på siden: /mappenavn/, for eksempel /fjordglimt/" }
          - { name: status, label: Status, type: select, options: { values: [Klar, Prototype, Kommer snart] } }
          - { name: skills, label: Hva man øver på, type: string }
      - { name: contactTitle, label: Kontakt – tittel, type: string }
      - { name: contactText, label: Kontakt – tekst, type: text }

  - name: english
    label: English text
    type: file
    path: src/content/en.json
    format: json
    fields: *textFields
